version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interviewiq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: interviewiq
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: interviewiq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: interviewiq
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: interviewiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: interviewiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongodb:27017/interviewiq
      POSTGRES_URL: postgresql://postgres:postgrespassword@postgres:5432/interviewiq
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_super_secure_jwt_key_interviewiq_min32chars!
      JWT_EXPIRES_IN: 7d
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: anthropic/claude-3.5-sonnet
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      - mongodb
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: interviewiq-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/interviewiq
      POSTGRES_URL: postgresql://postgres:postgrespassword@postgres:5432/interviewiq
      REDIS_URL: redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
    depends_on:
      - mongodb
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: interviewiq-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  postgres_data:
  redis_data:
