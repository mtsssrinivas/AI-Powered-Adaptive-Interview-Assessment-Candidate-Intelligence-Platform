services:
  # Backend API Gateway Service
  - type: web
    name: interviewiq-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        fromService:
          type: web
          name: interviewiq-web
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: POSTGRES_URL
        fromDatabase:
          name: interviewiq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: interviewiq-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Frontend Web Client Static Site
  - type: web
    name: interviewiq-web
    runtime: static
    buildCommand: npm ci && npm run build:shared && npm run build:client
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://interviewiq-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1

  # Redis Cache & Queue Broker
  - type: redis
    name: interviewiq-redis
    plan: free
    ipAllowList: []

databases:
  # PostgreSQL Database
  - name: interviewiq-postgres
    plan: free
    databaseName: interviewiq
    user: postgres
