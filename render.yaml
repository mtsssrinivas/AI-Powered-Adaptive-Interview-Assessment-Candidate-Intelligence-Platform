services:
  # Backend API Gateway Service
  - type: web
    name: interviewiq-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:server
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: POSTGRES_URL
        fromDatabase:
          name: interviewiq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: interviewiq-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Redis Cache & BullMQ Broker
  - type: redis
    name: interviewiq-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: interviewiq-postgres
    plan: free
    region: oregon
    databaseName: interviewiq
    user: interviewiq_user
