services:
  # Backend API Gateway Service
  - type: web
    name: interviewiq-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # PostgreSQL Database Connection String (from existing Render Postgres or external Postgres)
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      # Redis Cache & BullMQ Broker
      - key: REDIS_URL
        fromService:
          type: redis
          name: interviewiq-redis
          property: connectionString
      # MongoDB Atlas Connection String
      - key: MONGODB_URI
        sync: false
      # AI & Payment API Keys
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Redis Cache & BullMQ Broker (Free Key Value store)
  - type: redis
    name: interviewiq-redis
    plan: free
    region: oregon
    ipAllowList: []
